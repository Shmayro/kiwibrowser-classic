# Build and Release ARM APK for Kiwi Browser
name: Build and Release ARM APK

# Controls when the action will run. Triggers the workflow on push to main branch or manually
on:
  push:
    branches:
      - main # Or your default branch
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_and_release_arm:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Initializing build
        run: echo Initializing build for platform arm

      - name: Reclaiming disk space on / by disabling swap partition
        run: |
          sudo swapoff -av
          sudo rm -f /swapfile

      - name: Reclaiming disk space on / by removing .NET framework and unused dependencies
        run: sudo rm -rf /usr/share/dotnet /imagegeneration

      - name: Checking-out source-code in $GITHUB_WORKSPACE
        uses: actions/checkout@v4 # Use a more recent version

      - name: Creating secondary disk folder on /dev/disk/azure/resource-part1 (SSD)
        run: |
          sudo mkdir -p /extended_data
          sudo chown -R runner:docker /extended_data

      - name: On SSD - Creating symlink on /dev/disk/azure/root-part1 pointing to /dev/disk/azure/resource-part1
        run: |
          sudo ln -s /extended_data /mnt/secondary_disk
          sudo ln -s /mnt/secondary_disk $GITHUB_WORKSPACE/

      - name: Checking-out CIPD dependencies in /mnt/secondary_disk/.cipd
        uses: actions/checkout@v4 # Use a more recent version
        with:
          repository: kiwibrowser/dependencies
          path: ./secondary_disk/.cipd

      - name: Linking .cipd in the proper path and copying .gclient and .gclient_entries
        run: |
          ln -s $GITHUB_WORKSPACE/secondary_disk/.cipd .cipd
          cp .cipd/.gclient $GITHUB_WORKSPACE
          cp .cipd/.gclient_entries $GITHUB_WORKSPACE


      - name: Updating APT repository
        run: sudo apt-get update

      - name: Installing Python and OpenJDK
        run: sudo apt-get install -y python2 openjdk-8-jdk-headless libncurses5 ccache ninja-build

      - name: Installing system dependencies
        run: |
          sudo bash install-build-deps.sh --no-chromeos-fonts
          python2 build/linux/sysroot_scripts/install-sysroot.py --arch=i386
          python2 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64

      - name: Creating output folder
        run: mkdir -p secondary_disk/out/android_arm

      - name: Generating one-time APK signature key
        run: keytool -genkey -v -keystore keystore.jks -alias dev -keyalg RSA -keysize 2048 -validity 10000 -storepass public_password -keypass public_password -dname "cn=Kiwi Browser (unverified), ou=Actions, o=Kiwi Browser, c=GitHub"

      - name: Copying args.gn to target folder
        run: cat .build/android_arm/args.gn | sed "s#android_default_version_name = \"Git\"#android_default_version_name = \"Git$(date '+%y%m%d')Gen${{ github.run_id }}\"#" > secondary_disk/out/android_arm/args.gn

      - name: Modifying args.gn (arm)
        run: sed -i "s#android_default_version_code = \"1\"#android_default_version_code = \"$(date '+%y%m%d')1\"#" secondary_disk/out/android_arm/args.gn

      - name: Displaying args.gn
        run: cat secondary_disk/out/android_arm/args.gn

      - name: Downloading depot_tools
        working-directory: ./secondary_disk
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - name: Adding depot_tools to path
        run: echo "$GITHUB_WORKSPACE/secondary_disk/depot_tools" >> $GITHUB_PATH

      - name: Setting environment variables
        run: |
          echo "CC=ccache clang -Qunused-arguments" >> $GITHUB_ENV
          echo "CXX=ccache clang++ -Qunused-arguments" >> $GITHUB_ENV

      - name: Checking available disk-space
        run: df -h


      - name: Creating cache folder on /dev/disk/azure/resource-part1 (SSD)
        run: |
          sudo mkdir -p /mnt/cache
          sudo chown -R runner:docker /mnt/cache

      - name: Creating symlink in $HOME/cache pointing to cache on /dev/disk/azure/resource-part1
        run: ln -s /mnt/cache $HOME/


      - name: Checking available disk-space after downloading cache
        run: df -h

      - name: Fetching number for the latest stable version of Chromium
        run: curl "https://omahaproxy.appspot.com/all" | grep -Fi "android,stable" | cut -f3 -d"," | awk '{split($0,a,"."); print "MAJOR=" a[1] "\nMINOR=" a[2] "\nBUILD=" a[3] "\nPATCH=" a[4]}' > chrome/VERSION

      - name: Calculating cache size
        run: du -csh $HOME/cache

      - name: Creating ccache configuration
        run: |
          mkdir -p $HOME/.ccache/
          echo 'compiler_check = none' >> $HOME/.ccache/ccache.conf
          echo "stats = false" >> $HOME/.ccache/ccache.conf
          echo 'max_size = 20G' >> $HOME/.ccache/ccache.conf
          echo "base_dir = $HOME" >> $HOME/.ccache/ccache.conf
          echo "cache_dir = $HOME/cache" >> $HOME/.ccache/ccache.conf
          echo "hash_dir = false" >> $HOME/.ccache/ccache.conf

      - name: Check Python versions before runhooks
        run: |
          echo "Default Python version before runhooks:"
          which python && python --version || echo "python command failed or not found"
          echo "Python 2 version:"
          which python2 && python2 --version || echo "python2 command failed or not found"

      - name: Running gclient runhooks
        run: gclient runhooks

      - name: Check if rules.aar exists after runhooks
        run: |
          FILE_PATH="$GITHUB_WORKSPACE/third_party/android_support_test_runner/lib/rules.aar"
          if [ -f "$FILE_PATH" ]; then
            echo "File $FILE_PATH exists."
          else
            echo "File $FILE_PATH does NOT exist!"
            # Optionally, list directory contents for debugging
            echo "Listing contents of $GITHUB_WORKSPACE/third_party/android_support_test_runner/lib/"
            ls -l "$GITHUB_WORKSPACE/third_party/android_support_test_runner/lib/" || echo "Directory listing failed."
            # Exit with error if file is missing, as gn gen will fail
            exit 1 
          fi

      # --- Start: Force Python 2 before gn gen ---
      - name: Check Python versions after runhooks, before forcing Python 2
        run: |
          echo "Default Python version after runhooks:"
          which python && python --version || echo "python command failed or not found"

      # Force 'python' command to use python2
      - name: Create local bin and link python to python2
        run: |
          mkdir -p $HOME/.local/bin
          # Remove existing link if it exists to avoid error
          rm -f $HOME/.local/bin/python
          ln -s /usr/bin/python2 $HOME/.local/bin/python
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python points to python2 before gn gen
        run: |
          echo "Python version after PATH modification (before gn gen):"
          which python && python --version
      # --- End: Force Python 2 before gn gen ---

      - name: Generating build files
        run: gn gen ./secondary_disk/out/android_arm

      - name: Checking available disk-space before build
        run: df -h

      - name: Compiling source-code (full)
        run: ninja -C ./secondary_disk/out/android_arm chrome_public_apk



      - name: Checking available disk-space after build
        run: df -h

      - name: Find the generated APK
        id: find_apk
        run: echo "::set-output name=apk_path::$(find ./secondary_disk/out/android_arm/apks -name '*.apk' | head -n 1)"

      - name: Display APK path
        run: |
          echo "APK Path:"
          echo "${{ steps.find_apk.outputs.apk_path }}"

      - name: Create Release
        id: create_release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tagName || github.ref_name }}
          release_name: Release ${{ github.event.inputs.tagName || github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: steps.create_release.outputs.upload_url != '' && steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.apk_path }}
          asset_name: kiwi-browser-${{ github.event.inputs.tagName || github.ref_name }}-arm.apk
          asset_content_type: application/vnd.android.package-archive